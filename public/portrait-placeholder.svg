<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213b"/>
      <stop offset="1" stop-color="#070d1c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="face" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#22305a"/>
      <stop offset="1" stop-color="#0b1427"/>
    </radialGradient>
  </defs>
  <!-- shoulders / torso -->
  <path d="M40 800 C 50 650 120 590 210 560 L 250 545 C 265 600 335 600 350 545 L 390 560 C 480 590 550 650 560 800 Z" fill="url(#body)"/>
  <path d="M40 800 C 50 650 120 590 210 560 L 250 545 C 265 600 335 600 350 545 L 390 560 C 480 590 550 650 560 800 Z" fill="url(#rim)" opacity="0.35"/>
  <!-- neck -->
  <path d="M252 470 L 348 470 L 352 552 C 335 598 265 598 248 552 Z" fill="#0d1730"/>
  <!-- head -->
  <ellipse cx="300" cy="350" rx="118" ry="146" fill="url(#face)"/>
  <ellipse cx="300" cy="350" rx="118" ry="146" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- hair -->
  <path d="M182 330 C 178 230 240 192 302 192 C 380 192 426 240 420 330 C 410 280 380 258 330 254 C 280 250 240 262 214 290 C 200 304 190 318 182 330 Z" fill="#070c18"/>
  <!-- rim light on shoulders -->
  <path d="M60 760 C 80 660 140 610 210 585" fill="none" stroke="#60A5FA" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  <path d="M540 760 C 520 660 460 610 390 585" fill="none" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
  <!-- label -->
  <text x="300" y="720" text-anchor="middle" font-family="Syne, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#94A3B8" fill-opacity="0.75">UPLOAD PORTRAIT</text>
</svg>
